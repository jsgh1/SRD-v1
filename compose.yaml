        "test": [
          "CMD",
          "mysqladmin",
          "ping",
          "--protocol=TCP",
          "-h",
          "127.0.0.1"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 20
      }
    },
    "mailpit": {
      "image": "axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365",
      "networks": [
        "internal",
        "local_access"
      ],
      "ports": [
