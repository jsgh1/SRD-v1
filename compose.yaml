    "antivirus": {
      "image": "clamav/clamav:1.4.6@sha256:71fbb76b397cd84a90043caf1178a7f81bd0c131a031e7b0619afd721fbfad41",
      "environment": {
        "CLAMAV_NO_FRESHCLAMD": "true",
        "CLAMAV_NO_MILTERD": "true",
        "CLAMD_CONF_SelfCheck": "60",
        "CLAMD_CONF_ConcurrentDatabaseReload": "no"
      },
      "networks": [
        "internal"
      ],
      "volumes": [
        "antivirus_signatures:/var/lib/clamav"
      ],
      "mem_limit": "2g",
      "healthcheck": {
        "test": [
          "CMD",
          "clamdcheck.sh"
        ],
        "interval": "10s",
        "timeout": "5s",
        "start_period": "90s",
        "retries": 18
      }
    },
    "antivirus-updater": {
      "image": "clamav/clamav:1.4.6@sha256:71fbb76b397cd84a90043caf1178a7f81bd0c131a031e7b0619afd721fbfad41",
      "command": [
        "sh",
        "/srd-update-signatures.sh"
      ],
      "networks": [
        "signature_updates"
      ],
      "volumes": [
        "antivirus_signatures:/var/lib/clamav",
        "./docker/update-signatures.sh:/srd-update-signatures.sh:ro"
      ],
      "mem_limit": "384m",
      "healthcheck": {
        "disable": true
      }
    },
    "mysql": {
      "image": "mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb",
