        "APP_NAME": "SRD-gateway",
        "APP_ENV": "local",
        "APP_DEBUG": "false",
        "APP_KEY": "${APP_KEY_GATEWAY:?Ejecuta scripts/Initialize.ps1}",
        "APP_URL": "http://localhost:8080",
        "APP_LOCALE": "es",
        "DB_CONNECTION": "mysql",
        "DB_HOST": "mysql",
        "DB_DATABASE": "srd_gateway",
        "DB_USERNAME": "srd_gateway",
        "DB_PASSWORD": "${DB_PASSWORD_GATEWAY:?Ejecuta scripts/Initialize.ps1}",
        "SESSION_DRIVER": "file",
        "SESSION_LIFETIME": "30",
        "SESSION_COOKIE": "srd_session",
        "SESSION_SAME_SITE": "strict",
        "SESSION_SECURE_COOKIE": "false",
        "CACHE_STORE": "file",
        "HASH_DRIVER": "argon",
        "MAIL_MAILER": "smtp",
        "MAIL_HOST": "mailpit",
        "MAIL_PORT": "1025",
        "MAIL_FROM_ADDRESS": "seguridad@srd.test",
        "MAIL_FROM_NAME": "SRD",
        "INTERNAL_KEY": "${INTERNAL_KEY:?Ejecuta scripts/Initialize.ps1}",
        "CHALLENGE_KEY": "${CHALLENGE_KEY:?Ejecuta scripts/Initialize.ps1}",
        "PUBLIC_URL": "http://localhost:8080"
      },
      "networks": [
        "internal"
      ],
      "depends_on": {
        "mysql": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 5
