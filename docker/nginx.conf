server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        set $srd_gateway gateway;
        proxy_pass http://$srd_gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SRD-Context "";
        proxy_set_header X-Organization-ID "";
        proxy_set_header X-Role "";
    }
    location ~ ^/api/v1/persons/[0-9a-fA-F-]+/photos {
        client_max_body_size 8m;
        proxy_read_timeout 100s;
        set $srd_gateway gateway;
        proxy_pass http://$srd_gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SRD-Context "";
        proxy_set_header X-Organization-ID "";
        proxy_set_header X-Role "";
    }
    location / { try_files $uri $uri/ /index.html; }
}
